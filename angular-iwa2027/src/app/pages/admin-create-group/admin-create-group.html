<section class="page">
  <header class="panel header">
    <div>
      <p class="eyebrow">Create group</p>
      <h1>Create subscription group</h1>
      <p class="lede">Any signed-in user can create a group and becomes the owner and admin of that group.</p>
    </div>
  </header>

  <article class="panel form-panel">
    @if (loading()) {
      <p class="status">Loading services...</p>
    } @else {
      @if (errorMessage()) {
        <p class="status status--error">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
        <p class="status status--success">{{ successMessage() }}</p>
      }

      <form class="form-grid" (ngSubmit)="create()">
        <label>
          Service
          <select name="serviceId" [(ngModel)]="form.serviceId">
            <option value="">Choose a service</option>
            @for (service of services(); track service.id) {
              <option [value]="service.id">{{ service.name }}{{ service.category ? ' - ' + service.category : '' }}</option>
            }
          </select>
        </label>

        <label>
          Title
          <input name="title" [(ngModel)]="form.title" placeholder="Spotify Family Group" />
        </label>

        <label>
          Total slots
          <input name="totalSlots" type="number" min="2" [(ngModel)]="form.totalSlots" />
        </label>

        <label>
          Monthly price
          <input name="monthlyPrice" type="number" min="0" step="0.01" [(ngModel)]="form.monthlyPrice" />
        </label>

        <button type="submit" [disabled]="saving()">
          {{ saving() ? 'Creating...' : 'Create group' }}
        </button>
      </form>
    }
  </article>
</section>
